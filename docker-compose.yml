name: tradesphere

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tradesphere
      POSTGRES_PASSWORD: tradesphere
      POSTGRES_DB: tradesphere
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradesphere -d tradesphere"]
      interval: 5s
      timeout: 3s
      retries: 20

  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tradesphere
      POSTGRES_PASSWORD: tradesphere
      POSTGRES_DB: tradesphere_test
      TZ: UTC
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradesphere -d tradesphere_test"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the database roles and applies migrations before the API starts. Development only:
  # the passwords below protect nothing but a local database.
  setup:
    build:
      context: ./backend
      target: dev
    image: tradesphere-api
    command: ["sh", "-c", "python -m app.cli provision-db && alembic upgrade head && python -m app.cli seed"]
    environment:
      ADMIN_DATABASE_URL: postgresql+psycopg://tradesphere:tradesphere@db:5432/tradesphere
      MIGRATION_DATABASE_URL: postgresql+psycopg://tradesphere_owner:dev-owner@db:5432/tradesphere
      DATABASE_URL: postgresql+psycopg://tradesphere_app:dev-app@db:5432/tradesphere
      OWNER_DB_PASSWORD: dev-owner
      APP_DB_PASSWORD: dev-app
      PLATFORM_DB_PASSWORD: dev-platform
      BACKUP_DB_PASSWORD: dev-backup
      JWT_SECRET: dev-only-secret-change-me-in-production-0123456789
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./backend
      target: dev
    image: tradesphere-api
    environment:
      DATABASE_URL: postgresql+psycopg://tradesphere_app:dev-app@db:5432/tradesphere
      MIGRATION_DATABASE_URL: postgresql+psycopg://tradesphere_owner:dev-owner@db:5432/tradesphere
      TEST_DATABASE_URL: postgresql+psycopg://tradesphere:tradesphere@db-test:5432/tradesphere_test
      JWT_SECRET: dev-only-secret-change-me-in-production-0123456789
      CORS_ORIGINS: '["http://localhost:5173"]'
      ENVIRONMENT: development
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      setup:
        condition: service_completed_successfully
      db-test:
        condition: service_healthy

volumes:
  pgdata:
